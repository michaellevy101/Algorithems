<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithm &amp; System Design Study Guides</title>

  <!-- Highlight.js theme (id required by docs.js for dark-mode swap) -->
  <link id="hljs-theme" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

  <!-- App styles -->
  <link rel="stylesheet" href="docs.css">
</head>
<body>

  <!-- Mobile hamburger -->
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>

  <!-- Mobile overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h1>📚 Study Guides</h1>
      <div class="search-container">
        <input id="searchInput" type="text" placeholder="Search guides…" autocomplete="off">
      </div>
    </div>

    <nav id="sidebarNav" class="sidebar-nav"></nav>

    <div class="sidebar-footer">
      <button id="themeToggle" aria-label="Toggle theme">🌙 Dark Mode</button>
    </div>
  </aside>

  <!-- Main content area (markdown rendered here) -->
  <main class="content">
    <div id="markdownContent" class="markdown-body"></div>
  </main>

  <!-- Dependencies: marked.js + highlight.js must load before docs.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="docs.js"></script>
</body>
</html>
